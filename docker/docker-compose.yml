version: '3.8'
services:
  postgres-proposta:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proposta_db
    volumes:
      - ./init-db/01-proposta-db.sql:/docker-entrypoint-initdb.d/01-proposta-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proposta_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  postgres-contratacao:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contratacao_db
    volumes:
      - ./init-db/02-contratacao-db.sql:/docker-entrypoint-initdb.d/02-contratacao-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contratacao_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432" 

  rabbitmq:
    image: rabbitmq:3-management
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  proposta-service:
    build:
      context: ..
      dockerfile: src/Services/PropostaService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PropostaDatabase=Host=postgres-proposta;Database=proposta_db;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
    depends_on:
      postgres-proposta:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - 5000:80

  contratacao-service:
    build:
      context: ..
      dockerfile: src/Services/ContratacaoService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ContratacaoDatabase=Host=postgres-contratacao;Database=contratacao_db;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
      - PropostaService__BaseUrl=http://proposta-service
    depends_on:
      postgres-contratacao:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      proposta-service:
        condition: service_started
    ports:
      - 5001:80

networks:
  default:
    driver: bridge
